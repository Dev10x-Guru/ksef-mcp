name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # `id-token` signs the provenance attestation and `attestations` writes it
    # to the repository's attestation store. Both belong to the job that
    # actually produces the files — an attestation made anywhere else would
    # vouch for artifacts the signer never saw. This is not the PyPI trusted
    # publishing token; that one is minted in `publish` below.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      # The interpreter comes from .python-version, which the project
      # pins exactly. Naming a version here would be a second source of
      # truth that drifts from the pin.
      - name: Build distributions
        run: uv build

      # The tag is the only thing a human types during a release, and
      # nothing else cross-checks it against the packaged metadata. A
      # mismatch would publish the pyproject version under an unrelated
      # tag, which cannot be undone on PyPI.
      - name: Verify tag matches packaged version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          if [ -z "$sdist" ]; then
            echo "No sdist in dist/ — the build produced nothing to check" >&2
            exit 1
          fi
          version=$(basename "$sdist" | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match built version v$version" >&2
            exit 1
          fi
          echo "Tag $TAG matches built version v$version"

      # Trusted publishing proves who uploaded the file; it says nothing about
      # where the file came from. The attestation closes that gap: it binds
      # each distribution's digest to this repository, this workflow and this
      # commit, so an integrator can check the wheel on PyPI against the
      # source it claims to be built from rather than trusting the upload.
      # Recorded before the upload step, so nothing unattested can reach the
      # artifact that `publish` downloads.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-dists
          path: dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/ksef-mcp/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dists
          path: dist/

      # Pinned to a commit, not to `release/v1`. That ref is a branch: whoever
      # controls this action's repository can move it, and this step runs with
      # an OIDC token that publishes as `ksef-mcp`. A tag would be no better —
      # tags move too. The comment names the version a human should read; the
      # SHA is what the runner obeys.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
