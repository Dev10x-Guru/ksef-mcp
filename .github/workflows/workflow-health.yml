name: Workflow Health

# Catches the class of failure behind #194: a workflow file GitHub cannot
# compile. Such a file produces a run with zero jobs, therefore no
# `check_run`, therefore nothing in any check list — a broken review bot is
# indistinguishable from a review bot that found nothing to say. This
# workflow turns that silence into a red check.
#
# The tell is cheap and exact. GitHub stores a workflow's `name:` field in
# the registry only if it managed to parse the file; when it did not, the
# registry falls back to the file path. So `name == path` means "never
# loaded", for any file, for any reason — no guessing at which expression
# broke.
#
# Runs on push to the default branch only. The registry check below reads
# the state of main, so on a PR it would report main's breakage against
# the very PR that fixes it. Before merge, look at the run list for the
# branch's own SHA instead: a file that fails to compile still produces a
# failed `push` run there, named after its path — that is how #194 was
# finally located, from the "Invalid workflow file" line on such a run.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  workflow-health:
    runs-on: ubuntu-latest
    steps:
      - name: Every workflow file must compile
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A workflow whose registered name equals its path was never
          # parsed. `dynamic/*` entries (Dependabot) have no file and are
          # named by GitHub itself, so they are excluded.
          BROKEN=$(gh api --paginate "repos/${REPOSITORY}/actions/workflows" \
            -q '.workflows[]
                | select(.path | startswith(".github/workflows/"))
                | select(.name == .path)
                | .path')

          if [ -n "$BROKEN" ]; then
            echo "::error::Te pliki workflow nie dają się wczytać przez GitHub Actions — ich przebiegi nie tworzą żadnego zadania, więc awaria nie pojawia się wśród kontroli."
            while IFS= read -r path; do
              echo "::error file=${path}::GitHub nie odczytał pola name: z ${path}. Dokładny komunikat kompilatora (linia i kolumna) jest na stronie nieudanego przebiegu push dla tego pliku, pod nagłówkiem „Invalid workflow file”. Typowa przyczyna: niepoprawne wyrażenie Actions gdziekolwiek w pliku, także w komentarzu wewnątrz run: (#194)."
            done <<< "$BROKEN"
            exit 1
          fi

          echo "Wszystkie pliki workflow wczytują się poprawnie."

      - name: No zero-job runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Belt and braces for the check above: a run reported under a file
          # path rather than a workflow name is the same startup failure seen
          # from the run side. Catches a file that compiled at registration
          # and stopped compiling later. Scoped to this one commit, so it
          # clears itself as soon as the offending file is fixed instead of
          # staying red on history nobody can rewrite.
          BROKEN_RUNS=$(gh api \
            "repos/${REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            -q '.workflow_runs[]
                | select(.name | startswith(".github/workflows/"))
                | "\(.name) (run \(.id))"' \
            | sort -u)

          if [ -n "$BROKEN_RUNS" ]; then
            echo "::error::Commit ${HEAD_SHA} ma przebiegi bez ani jednego zadania — workflow nie wystartował, a nie „nie miał uwag”."
            printf '%s\n' "$BROKEN_RUNS"
            exit 1
          fi

          echo "Brak przebiegów bez zadań dla ${HEAD_SHA}."
