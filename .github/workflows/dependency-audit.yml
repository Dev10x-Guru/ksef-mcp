name: Dependency audit

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A vulnerability appears without anybody touching this repository, so the
# schedule — not the pull-request trigger — is the reason this workflow
# exists. The path filter only shortens the feedback loop for a lock file
# that changes in a pull request.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # `--frozen` is what makes this an audit of the lock file rather than of
      # a fresh resolution: without it a vulnerable pin could be silently
      # resolved away here and still be what the taxpayer installs. Hashes are
      # dropped because pip-audit reads names and versions, and the project is
      # itself excluded — auditing our own unpublished revision says nothing.
      - name: Export the locked dependency set
        run: >
          uv export --frozen --all-groups --no-hashes --no-emit-project
          --format requirements-txt -o requirements-audit.txt

      # `--no-deps` tells pip-audit the file is already the complete closure,
      # so it audits exactly the pins uv resolved instead of re-resolving them
      # and auditing a set nobody will ever install.
      - name: Audit the locked dependencies
        run: >
          uv run pip-audit --requirement requirements-audit.txt --no-deps
          --progress-spinner off
