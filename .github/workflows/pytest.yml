name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    # `bin/**` należy tu tak samo jak `src/**`: narzędzia z tego katalogu mają
    # własny pakiet testów i własne zadanie, ale filtr ich nie wymieniał, więc
    # PR zmieniający wyłącznie `bin/` nie uruchamiał żadnego zadania. Skrypt
    # wydania przeszedł CI jedynie dlatego, że przy okazji dotknął pyproject.
    paths:
      # `src/**`, nie `src/**/*.py`: pakiet niesie też shim Node i zwendorowany
      # bundel generatora MF. Filtr wymieniający wyłącznie pliki `.py` puszczał
      # bez żadnego zadania PR, który psuł renderowanie PDF.
      - "src/**"
      - "tests/**/*.py"
      - "bin/**"
      - ".node-version"
      - "pyproject.toml"
      - "uv.lock"
      - ".bumpversion.toml"
      - ".github/workflows/pytest.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # Renderowanie PDF uruchamia oficjalny generator MF pod Node (D-027), a
      # test renderu pomija się tam, gdzie Node nie ma. Bez tego kroku bieg
      # byłby zielony dokładnie dlatego, że najważniejszy test się nie wykonał.
      # `node-version-file` czyta ten sam pin co reszta projektu, więc nie
      # powstaje drugie źródło prawdy — tak samo jak przy Pythonie niżej.
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      # No python-version here and no `uv python install`: the project
      # pins an exact interpreter in .python-version, and uv reads it.
      # Naming a version in this workflow too would create a second
      # source of truth that silently drifts from the pin.
      - name: Install dependencies
        run: uv sync --group dev

      # The coverage gate lives in pyproject ([tool.coverage.report]
      # fail_under = 100) so a local run and CI agree. Do not add a
      # --cov-fail-under flag here — it would silently shadow it.
      - name: Run tests
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Kontrakty kierunku importów żyją w `pyproject.toml`, obok reguł
      # ruffa, i ten krok jest jedynym miejscem, które je egzekwuje. Należy
      # do zadania `lint`, a nie do osobnego: dzieli z nim `uv sync`, a
      # `all-checks` już po nim dziedziczy, więc ochrona wchodzi bez
      # dokładania kolejnej nazwy do reguły ochrony gałęzi.
      - name: Imports
        run: uv run lint-imports

  # The ADR provenance tooling in bin/ carries its own pytest suite and is
  # deliberately excluded from the package's testpaths and coverage, so it
  # needs a separate invocation or it would never run.
  tooling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # --no-project keeps these standalone scripts runnable without the
      # package installed, but pytest still reads the root pyproject's
      # addopts, which ask for coverage of ksef_mcp. So pytest-cov has to
      # be present to parse those flags, and --no-cov then turns the
      # measurement off: bin/ is deliberately outside the package's
      # coverage scope and must not dilute its 100% gate.
      - name: Test the bin/ tooling
        run: uv run --no-project --with pytest --with pytest-cov pytest bin/ --no-cov

  # Single required status check to point branch protection at, so the
  # protection rule does not have to list every job by name.
  # `failure()` and `cancelled()` already evaluate across `needs`, so this
  # job runs only when something upstream went wrong — and then fails.
  all-checks:
    needs: [test, lint, tooling-tests]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
