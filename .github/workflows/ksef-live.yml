name: KSeF na żywo

# Testy `ksef_live` rozmawiają z prawdziwym rejestrem KSeF (GH-178), więc nie
# uruchamia ich żaden push ani PR — wyłącznie ręczne wyzwolenie. Każdy przebieg
# wydaje godzinowy budżet podmiotu testowego, a Ministerstwo rejestruje wzorce
# wyglądające na obchodzenie limitów: bieg automatyczny przy każdej zmianie
# byłby dokładnie takim wzorcem.
on:
  workflow_dispatch:

# Jeden przebieg naraz i bez anulowania trwającego: dwa równoległe eksporty
# tego samego podmiotu to podwójny wydatek z tego samego budżetu, a przerwany
# eksport zostawia w rejestrze paczkę, po którą nikt nie wróci.
concurrency:
  group: ksef-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    # Sekrety podmiotu testowego żyją w środowisku `ksef-test`, nie na
    # poziomie repozytorium: widzi je tylko to zadanie.
    environment: ksef-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # Test renderu na prawdziwej fakturze (GH-82) też nosi `ksef_live` i bez
      # Node pominąłby się po cichu.
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: uv sync --group dev

      # Ten sam skrypt co `make test-live` na maszynie opiekuna (GH-265): pisze
      # konfigurację z `environment: "test"` wpisanym w kodzie — nie ma
      # zmiennej, która mogłaby skierować bieg na produkcję (CLAUDE.md) —
      # i podaje token ścieżką awaryjną `KSEF_TOKEN` (D-004), bo runner nie
      # ma magazynu kluczy. Brak któregoś sekretu zatrzymuje bieg przed
      # pierwszym zapytaniem, z nazwą brakującego klucza.
      - name: Run live tests
        env:
          KSEF_LIVE_TEST_NIP: ${{ secrets.KSEF_TEST_NIP }}
          KSEF_LIVE_TEST_TOKEN: ${{ secrets.KSEF_TOKEN }}
        run: bin/ksef_live.py
