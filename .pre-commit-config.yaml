repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The vendored Ministry of Finance invoice renderer is ~3.1 MB and is a
        # binary pin, like any other pinned version. Only that path is exempt.
        exclude: ^src/ksef_mcp/vendor/
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      # Te dwa hooki PRZEPISUJĄ pliki, więc na zwendorowanym artefakcie robią
      # szkodę, nie porządek: trailing-whitespace zmienił bundel MF przy
      # pierwszym uruchomieniu, unieważniając sumę SHA-256 z noty licencyjnej i
      # zgodność bajt w bajt z plikiem serwowanym przez portal. Wyłączenie
      # obejmuje cały `vendor/`, bo cały ten katalog jest cudzy.
      - id: end-of-file-fixer
        exclude: ^src/ksef_mcp/vendor/
      - id: trailing-whitespace
        exclude: ^src/ksef_mcp/vendor/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Nota licencyjna zapisuje rozmiar i skrót zwendorowanego generatora MF, a
  # portal Ministerstwa dwukrotnie zerwał transfer w połowie. Ten hook liczy
  # jedno i drugie, więc obcięty plik zatrzymuje się na commicie, a nie u
  # podatnika. `always_run`, bo notę można przepisać bez dotykania bundla —
  # i wtedy niezgodność jest właśnie tym, co trzeba zobaczyć.
  - repo: local
    hooks:
      - id: vendor-bundle
        name: zwendorowany bundel MF zgodny z notą licencyjną
        entry: bin/vendor_bundle.py
        language: script
        pass_filenames: false
        always_run: true

  # Local half of the commit-message contract; the other half is the gitlint
  # step in .github/workflows/git.yml. Edit .gitlint and that step together.
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]
