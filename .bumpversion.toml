[tool.bumpversion]
current_version = "0.3.3.dev0"
allow_dirty = false

# `main` carries `X.Y.Z.dev0` between releases so a wheel built from it is
# distinguishable from the one on PyPI; the release itself drops the suffix.
# Both forms therefore have to parse. Every bump here is driven by
# `--new-version` from bin/release.py, so `serialize` only decides how a
# number is written back, never which part gets incremented.
parse = '''(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\.dev(?P<dev>\d+))?'''
serialize = [
    "{major}.{minor}.{patch}.dev{dev}",
    "{major}.{minor}.{patch}",
]

# Bez tego `.dev0` znika po cichu: dla części liczbowej `optional_value`
# domyślnie równa się `first_value`, więc `dev = 0` uchodzi za wartość
# domyślną i serializacja wybiera krótszy format. Sufiks, o który tu
# chodzi, to dokładnie `dev0` — jedyna wartość, którą dotąd gubiliśmy.
[tool.bumpversion.parts.dev]
first_value = "0"
optional_value = "none"

# Neither commit nor tag: bin/release.py owns both, so that the guard rails
# run between changing the number and making it irreversible. A tag created
# here would be pushed before anything checked whether PyPI already has it.
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# The lockfile repeats the project's own version. Anchored on the package
# name so the replacement cannot wander into a dependency's version.
[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''name = "ksef-mcp"
version = "{current_version}"'''
replace = '''name = "ksef-mcp"
version = "{new_version}"'''
