[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksef-mcp"
version = "0.3.5.dev0"
description = "Local MCP server for KSeF, Poland's national e-invoicing system"
readme = "README.md"
requires-python = "==3.13.14"
license = "AGPL-3.0-only"
# The vendored MIT-licensed artifact ships in the wheel (ADR-112), so its
# notice must ship in `.dist-info/licenses/` too — the project's own LICENSE
# alone does not cover it.
license-files = ["LICENSE", "src/ksef_mcp/rendering/vendor/LICENCJA-MF.md"]
authors = [{ name = "Dev10x.Guru" }]
keywords = ["ksef", "mcp", "e-invoicing", "faktury", "poland"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Polish",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp==2.2.0",
    "keyring==25.7.0",
    "platformdirs==4.11.8",
    "ksef2==0.19.0",
    # AES-256-CBC over the export package (D-031 §7). It already arrives with
    # `ksef2`, but code that imports a package declares it — a transitive pin
    # is somebody else's decision to change.
    "cryptography==50.0.1",
    # Imported directly to read the collection's lock state without keyring's
    # own unlock prompt (D-004, ST-3). It arrives with keyring on Linux
    # anyway, but code that imports a package declares it.
    "secretstorage==3.5.0 ; sys_platform == 'linux'",
]

[project.urls]
Homepage = "https://github.com/Dev10x-Guru/ksef-mcp"
Issues = "https://github.com/Dev10x-Guru/ksef-mcp/issues"

[project.scripts]
ksef-mcp = "ksef_mcp.cli:main"

# Hatchling selects files by asking the VCS what is ignored, so until this
# list existed the presence of the Node shim and the Ministry's renderer in
# the distribution rested on `.gitignore` alone. A later `*.js` or
# `package.json` entry there would empty them out of the wheel without
# failing anything: the install succeeds, the import succeeds, the suite is
# green, and `render_invoice_pdf` breaks in the user's hands. `artifacts`
# overrides the ignore rules, and it sits under `[tool.hatch.build]` rather
# than under a target because `uv build` builds the wheel out of the sdist —
# a resource missing from the sdist is missing from the wheel too (#106).
[tool.hatch.build]
artifacts = [
    "src/ksef_mcp/rendering/node/render.mjs",
    "src/ksef_mcp/rendering/vendor/ksef-fe-invoice-converter.*.js",
    "src/ksef_mcp/rendering/vendor/package.json",
    "src/ksef_mcp/rendering/vendor/LICENCJA-MF.md",
]

# Stated rather than inferred from the distribution name: a rename that
# breaks the inference fails the build instead of shipping an empty wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/ksef_mcp"]

[dependency-groups]
dev = [
    "anyio==4.15.1",
    "bump-my-version==1.5.1",
    # Ruff's `E, F, I, UP, B, ANN, RUF` selection says nothing about which
    # package may import which — `flake8-tidy-imports` bans symbols, not
    # directions. The layout settled by #129/#131/#132/#133 is therefore held
    # up by review discipline alone, and the first backwards import would pass
    # CI unremarked (#150).
    "import-linter==2.15",
    # The scanner belongs in the lock file rather than in a `--with` flag on
    # the workflow: a scanner pinned only in CI is a version nobody updates,
    # and a stale advisory database is the one failure this job cannot report.
    # Here Dependabot bumps it along with the rest of the dev group (#109).
    "pip-audit==2.9.0",
    # Reads the text back out of a rendered PDF. Only the test suite needs it:
    # a build that renders empty boxes or drops the line items passes a
    # `startswith(b"%PDF")` check without a murmur (#82, GH-174).
    "pypdf==6.19.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A live test spends the hourly KSeF query budget and the Ministry logs
# breaches, so the default run must exclude them rather than rely on the
# caller remembering to.
addopts = "--cov=ksef_mcp --cov-report=term-missing -m 'not ksef_live'"
markers = ["ksef_live: reaches a real KSeF endpoint; excluded by default"]

[tool.coverage.run]
branch = true
source = ["src/ksef_mcp"]

[tool.coverage.report]
fail_under = 100
exclude_also = ["if TYPE_CHECKING:"]

[tool.coverage.html]
directory = ".tmp/coverage"

# The layout is described here in the direction it is allowed to be read:
# every layer may import the ones below it and none of the ones above. The
# order is derived from the tree as it stands, not from an ideal one — a
# contract that needs an `ignore_imports` exception to pass protects nothing,
# so where the tree genuinely holds a two-way edge the modules share a layer
# and the coupling stays visible here instead of being waived (#150).
[tool.importlinter]
root_package = "ksef_mcp"

[[tool.importlinter.contracts]]
name = "Zależności biegną w dół, nigdy w górę"
type = "layers"
containers = ["ksef_mcp"]
# `exhaustive` is the half that keeps this honest over time: a new top-level
# module has to be placed in the order deliberately, instead of joining the
# package as an unranked island nothing constrains.
exhaustive = true
# `:` means the modules of one layer may read each other, `|` that they may
# not. Two such pairs sit in `allowance : config : invoices : storage` and are
# the only remaining two-way edges in the package: `storage.archive` reads
# `invoices.package`, while `invoices` reads all of `storage`; and
# `storage.period_cache` reads `allowance`, while `allowance` and `config`
# read `storage.durability`.
layers = [
    "cli",
    "server",
    "messages",
    "rendering | retention | setup",
    "allowance : config : invoices : storage",
    "keyring_preflight | paths",
    "ksef_port",
    "diagnostics",
    "clock | errors | metadata",
]

[[tool.importlinter.contracts]]
name = "Konteksty faktur, renderu i konfiguracji klienta nie znają się wzajemnie"
type = "independence"
modules = [
    "ksef_mcp.invoices",
    "ksef_mcp.rendering",
    "ksef_mcp.setup",
]

# ADR-102 in the direction the suite could not check: `tests/
# test_port_substitutability.py` guards the port against the `ksef2` SDK
# below it, this guards it against the project above it. The issue proposing
# the contract allowed `config` through — that edge was cut by #122, so the
# port today reads exactly two modules from above, and the contract records
# the tighter truth rather than the older plan.
[[tool.importlinter.contracts]]
name = "Port KSeF nie sięga po nic ponad sobą poza wyjątkami i dziennikiem"
type = "forbidden"
source_modules = ["ksef_mcp.ksef_port"]
forbidden_modules = [
    "ksef_mcp.allowance",
    "ksef_mcp.cli",
    "ksef_mcp.config",
    "ksef_mcp.invoices",
    "ksef_mcp.keyring_preflight",
    "ksef_mcp.messages",
    "ksef_mcp.paths",
    "ksef_mcp.rendering",
    "ksef_mcp.retention",
    "ksef_mcp.server",
    "ksef_mcp.setup",
    "ksef_mcp.storage",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "bin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
