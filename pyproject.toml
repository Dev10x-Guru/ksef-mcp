[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksef-dev10x-guru"
version = "0.1.0"
description = "Local MCP server for KSeF, Poland's national e-invoicing system"
readme = "README.md"
requires-python = "==3.13.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Dev10x.Guru" }]
keywords = ["ksef", "mcp", "e-invoicing", "faktury", "poland"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Polish",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["mcp==2.2.0"]

[project.urls]
Homepage = "https://github.com/Dev10x-Guru/ksef-mcp"
Issues = "https://github.com/Dev10x-Guru/ksef-mcp/issues"

[project.scripts]
ksef-dev10x-guru = "ksef_mcp.server:main"

# Hatchling infers the shipped directory from the distribution name, which
# no longer matches the import package. Without this it refuses to build.
[tool.hatch.build.targets.wheel]
packages = ["src/ksef_mcp"]

[dependency-groups]
dev = [
    "anyio==4.15.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ksef_mcp --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/ksef_mcp"]

[tool.coverage.report]
fail_under = 100
exclude_also = ["if TYPE_CHECKING:"]

[tool.coverage.html]
directory = ".tmp/coverage"

[tool.ruff]
line-length = 100
src = ["src", "tests", "bin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
