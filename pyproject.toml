[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksef-mcp"
version = "0.1.0"
description = "Local MCP server for KSeF, Poland's national e-invoicing system"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Dev10x.Guru" }]
keywords = ["ksef", "mcp", "e-invoicing", "faktury", "poland"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Polish",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["mcp>=2.2.0"]

[project.urls]
Homepage = "https://github.com/Dev10x-Guru/ksef-mcp"
Issues = "https://github.com/Dev10x-Guru/ksef-mcp/issues"

[project.scripts]
ksef-mcp = "ksef_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "anyio>=4.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ksef_mcp --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/ksef_mcp"]

[tool.coverage.report]
fail_under = 100
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
